# Source of truth for App/MKVForge.xcodeproj (docs/LESSONS.md L19, L33). Never hand-edit
# project.pbxproj: change this file, then `brew install xcodegen; cd App && xcodegen generate`
# (XcodeGen 2.48.0) in a clone folder named mkv-forge, and commit both. A second run must
# change nothing. Only scripts/bump-version.sh edits the version lines in both.
# The Xcode project must not sit next to Package.swift, and the package must not be
# named MKVForge, or Xcode reports the products as missing.
name: MKVForge
options:
  bundleIdPrefix: com.arezhik
  deploymentTarget:
    macOS: "15.0"
  # Off: with `path: .` below, intermediate groups leave the App group out of the project
  # under random TEMP_ IDs (L33).
  createIntermediateGroups: false
  defaultConfig: Release
settings:
  # XcodeGen ignores plain keys next to configs:, so project-wide keys go under base: (L33).
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      # Do not set ARCHS here. Debug follows the run destination (My Mac),
      # so the app and the package module are the same chip.
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  CorePackage:
    path: ..
targets:
  MKVForge:
    type: application
    platform: macOS
    sources:
      - path: .
        includes:
          - "*.swift"
          - Info.plist
          # The app icon (AppIcon.appiconset). XcodeGen puts the catalog in the Resources phase.
          - Assets.xcassets
        excludes:
          - "MKVUITests/**"
    # App Sandbox stays off. A sandboxed app can read a chosen file but cannot
    # create a new file next to it, and ad-hoc "Sign to Run Locally" has no
    # provisioning profile for a sandbox entitlement.
    dependencies:
      - package: CorePackage
        product: MKVForgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arezhik.MKVForge
        PRODUCT_NAME: MKVForge
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Info.plist declares no document types (no drag and drop or Open With).
        INFOPLIST_FILE: Info.plist
        # Version: change with scripts/bump-version.sh only, so this file and the
        # .xcodeproj stay in sync. MARKETING_VERSION is what users see (MAJOR.MINOR.PATCH).
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_CFBundleDisplayName: MKVForge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: [arm64, x86_64]
    scheme:
      gatherCoverageData: false
  MKVForgeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      # Recurses into Tests, Pages, Components, Helpers, and Base.
      # README.md is documentation for that layout. Leave it out of the test bundle.
      - path: MKVUITests
        excludes:
          - "README.md"
          - "**/*.md"
    dependencies:
      - target: MKVForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arezhik.MKVForgeUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MKVForge
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
schemes:
  MKVForge-UITests:
    build:
      targets:
        MKVForge: all
        MKVForgeUITests: [test]
    test:
      targets:
        - MKVForgeUITests
