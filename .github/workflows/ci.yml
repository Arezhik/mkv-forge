# Generated by macos-swift-app-boilerplate.sh.
# Three jobs: Linux tests (the same gate cloud agents run), macOS tests, and the
# universal unsigned app with MKVForge-universal.zip as the download.
# Swift 6.2.4 is pinned here, in .cursor/environment.json, and in AGENTS.md.
# Change all three together (docs/LESSONS.md L18).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.4
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install system packages
        # Keep this list the same as the apt line in .cursor/environment.json.
        run: apt-get update -qq && apt-get install -y --no-install-recommends mkvtoolnix

      - name: Version is in sync
        # project.pbxproj, project.yml, and CHANGELOG.md must agree (scripts/bump-version.sh).
        run: bash scripts/bump-version.sh --check

      - name: Build number is above the base branch
        # Two PRs that bump at once collide (docs/LESSONS.md L20). The fix is
        # scripts/bump-version.sh --rebase origin/<base> <rule>.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          bash scripts/bump-version.sh --check-against "origin/$BASE"

      - name: Project files are consistent
        # App sources vs project.pbxproj, project.yml vs pbxproj, case-only path clashes (L17, L19).
        run: bash scripts/check-project.sh

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos-tests:
    name: macOS tests
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos:
    name: macOS universal app
    # Use a runner whose Xcode matches the Mac you test on (for example a self-hosted
    # or larger runner label). Hosted images can lag or carry framework bugs, so keep
    # framework-heavy unit tests on the macos-tests job. Generated with: macos-latest
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve local package
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/.build"
          set +e
          LOG=$(xcodebuild \
            -resolvePackageDependencies \
            -project App/MKVForge.xcodeproj \
            -scheme MKVForge \
            -derivedDataPath "$GITHUB_WORKSPACE/build" 2>&1)
          code=$?
          set -e
          echo "$LOG"
          test "$code" -eq 0
          echo "$LOG" | grep -q "MKVForgeKit"
          echo "$LOG" | grep -qi "resolved source packages"
          if echo "$LOG" | grep -q "Missing package product"; then
            echo "Package products did not bind"
            exit 1
          fi

      - name: Build Debug app
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build-debug"
          xcodebuild \
            -project App/MKVForge.xcodeproj \
            -scheme MKVForge \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$GITHUB_WORKSPACE/build-debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          BIN="$GITHUB_WORKSPACE/build-debug/Build/Products/Debug/MKVForge.app/Contents/MacOS/MKVForge"
          if [ ! -f "$BIN" ]; then
            BIN="$(find "$GITHUB_WORKSPACE/build-debug" -type f -path '*/Debug/MKVForge.app/Contents/MacOS/MKVForge' | head -1)"
          fi
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Debug architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          if echo "$ARCHS" | grep -qw x86_64; then
            echo "Debug My Mac build included Intel. ONLY_ACTIVE_ARCH should keep it to arm64."
            exit 1
          fi

      - name: Build universal app
        run: |
          xcodebuild \
            -project App/MKVForge.xcodeproj \
            -scheme MKVForge \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify both architectures and zip
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/MKVForge.app"
          if [ ! -d "$APP" ]; then
            APP="$(find "$GITHUB_WORKSPACE/build" -type d -name 'MKVForge.app' | head -1)"
          fi
          test -d "$APP"
          BIN="$APP/Contents/MacOS/MKVForge"
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          INFO="$APP/Contents/Info.plist"
          test -f "$INFO"
          plutil -extract CFBundleIdentifier raw "$INFO" | grep -qx com.arezhik.MKVForge
          # MKVForge takes folders from Choose… buttons only, so it declares no document types.
          if plutil -extract CFBundleDocumentTypes xml1 -o - "$INFO" >/dev/null 2>&1; then
            echo "Info.plist should not declare CFBundleDocumentTypes (no drag and drop or Open With)"
            exit 1
          fi
          ENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          if printf '%s' "$ENTS" | grep -q 'com.apple.security.app-sandbox'; then
            echo "App Sandbox should stay off so output files can be written next to the input"
            exit 1
          fi
          # Ad-hoc signature (no identity, no secrets): seals the bundle so macOS lets
          # testers' copies post the batch-finished notification (Phase 5 Q6).
          codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/MKVForge-universal.zip"
          test -s "$GITHUB_WORKSPACE/MKVForge-universal.zip"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          path: MKVForge-universal.zip
          if-no-files-found: error
          archive: false
